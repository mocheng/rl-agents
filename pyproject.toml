[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-agents"
dynamic = ["version"]
description = "A collection of Reinforcement Learning agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["reinforcement learning", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Researchers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "gymnasium>=1.0",
    "numpy",
    "pandas",
    "numba",
    "pygame-ce",
    "matplotlib",
    "seaborn",
    "six",
    "docopt",
    "torch>=2.0",
    "tensorboardX",
    "tensorboard",
    "moviepy",
    "scipy",
    "torchrl[torchrl]>=0.7",
    "highway-env[highway]==1.12.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
# Batch-parallel DQN training with torchrl (see TORCHRL_INTEGRATION.md)
torchrl = [
    "torchrl>=0.7",
]
# Driving environments (see HOWTO.md): highway-env 1.12 requires gymnasium>=1.0
highway = [
    "highway-env==1.12.1",
]

[dependency-groups]
dev = [
    "box2d>=2.3.10",
    "pytest",
    "ruff",
    "stable-baselines3>=2.9.0",
]

[tool.setuptools.packages.find]
include = ["rl_agents*"]
exclude = ["scripts*", "tests*", "docs*"]

[tool.setuptools_scm]
fallback_version = "1.0.dev0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
